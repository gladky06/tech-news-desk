<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech News Desk</title>
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Desk">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--line:#232b35;--text:#e8ebf0;--muted:#8b95a5;--faint:#5c6675;
--accent:#f5b041;--accent-ink:#1b1403;--up:#3ecf8e;--down:#f0616d;--blue:#6ea8fe;--shadow:0 12px 40px rgba(0,0,0,.45)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f3ee;--panel:#fff;--panel2:#faf8f4;--line:#e3dfd6;--text:#17191d;--muted:#667080;--faint:#98a0ad;
--accent:#b86e00;--accent-ink:#fff;--up:#0f8a58;--down:#c9303f;--blue:#2f6fd6;--shadow:0 12px 40px rgba(40,30,10,.14)}}
:root[data-theme=light]{--bg:#f5f3ee;--panel:#fff;--panel2:#faf8f4;--line:#e3dfd6;--text:#17191d;--muted:#667080;--faint:#98a0ad;
--accent:#b86e00;--accent-ink:#fff;--up:#0f8a58;--down:#c9303f;--blue:#2f6fd6;--shadow:0 12px 40px rgba(40,30,10,.14)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
header{display:flex;align-items:center;gap:14px;padding:16px 0 12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;display:flex;align-items:center;gap:9px}
.brand i{width:9px;height:9px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--up);box-shadow:0 0 0 0 var(--up);animation:pulse 2.4s infinite}
.dot.stale{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,207,142,.5)}70%{box-shadow:0 0 0 8px rgba(62,207,142,0)}100%{box-shadow:0 0 0 0 rgba(62,207,142,0)}}
.iconbtn{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--muted)}
.hero{display:grid;grid-template-columns:330px 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.px{font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.px small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:6px}
.chg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.chg div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.chg b{display:block;font-size:14px;font-weight:600}.chg span{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.up{color:var(--up)}.down{color:var(--down)}
.tgt{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.tgt b{font-size:22px;font-weight:600;display:block}.tgt .lbl{display:block;white-space:nowrap}.tgt .num{font-size:16px}.tgt b.num{font-size:22px}
.bar{height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);margin-top:10px;position:relative}
.bar i{position:absolute;top:-4px;width:2px;height:12px;background:var(--text)}
.bar u{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px;opacity:.55}
.chartcard{position:relative;padding-bottom:8px;min-height:250px}
.charthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.mv{border-radius:2px;background:var(--down);opacity:.35;width:6px;height:11px}
svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;width:270px;box-shadow:var(--shadow);z-index:5;display:none}
.tip h5{margin:0 0 4px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.tip p{margin:5px 0 0;color:var(--muted);line-height:1.35}.tip p b{color:var(--text);font-weight:500}
.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px;align-items:start}
.side{display:grid;gap:14px;position:sticky;top:12px}
.drv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border-radius:9px;width:100%;text-align:left;margin-top:4px;border:1px solid transparent}
.drv:hover{background:var(--panel2)}.drv.on{border-color:var(--accent);background:var(--panel2)}
.drv b{font-size:13px;font-weight:600}.drv em{font-style:normal;font-size:11px;color:var(--muted);grid-column:1}
.drv .n{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--muted)}
.heat{grid-column:1/3;height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.heat i{display:block;height:100%;background:var(--accent)}
.th{padding:10px 0;border-top:1px solid var(--line)}.th:first-of-type{border-top:0}
.th b{font-size:13px;font-weight:600;display:block}.th span{font-size:12px;color:var(--muted)}
.th .pill{float:right;margin-left:8px}
.pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.high{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.medium{color:var(--blue);border-color:var(--blue)}
.pill.tier{color:var(--accent);border-color:var(--accent)}
.pill.new{color:var(--up);border-color:var(--up)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text)}
.seg button span{font-weight:500;color:var(--faint);margin-left:5px}
.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit;outline:0}
.search:focus{border-color:var(--accent)}
.day{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 2px 8px;display:flex;gap:10px;align-items:center}
.day:after{content:"";flex:1;height:1px;background:var(--line)}
.story{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;position:relative}
.story.high{border-left:3px solid var(--accent)}
.story.sel{outline:2px solid var(--accent);outline-offset:1px}
.story .t{grid-column:2;font-size:15.5px;font-weight:600;line-height:1.3}
.story a.t:hover{text-decoration:underline;text-underline-offset:3px}
.story .m{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.story .why{grid-column:2;font-size:12px;color:var(--muted);margin-top:2px}
.story .why b{color:var(--text);font-weight:500}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.add{grid-row:1/4;grid-column:3;align-self:start;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:16px;line-height:1}
.add.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{grid-row:1/4;grid-column:1;align-self:start;margin-top:2px;width:62px;text-align:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.brief{position:fixed;right:20px;bottom:20px;z-index:20}
.fab{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(760px,100%);max-height:86vh;overflow:auto;padding:20px}
.sheet h3{margin:0 0 4px;font-size:18px}.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.row input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:6px 8px;font:inherit}
textarea{width:100%;min-height:210px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.btn{background:var(--text);color:var(--bg);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--faint);display:flex;gap:6px 16px;flex-wrap:wrap}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.srcs span{font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.srcs span.bad{color:var(--down);border-color:var(--down)}
@media (max-width:860px){.hero,.grid{grid-template-columns:1fr}.side{position:static}.px{font-size:38px}.badge{width:auto}.story{grid-template-columns:1fr auto}.badge{grid-column:1;grid-row:auto;justify-self:start}.story .t,.story .m,.story .why{grid-column:1}.add{grid-column:2;grid-row:1/3}.wrap{padding:0 16px 90px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><i></i><span id="title">Tech News Desk</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">Loading</span>
      <button class="iconbtn" id="theme" title="Switch theme">◐</button></div>
  </header>

  <section class="hero">
    <div class="card" id="pricecard"></div>
    <div class="card chartcard">
      <div class="charthead"><span class="lbl">Price and material news</span>
        <span class="legend"><span><i></i>Material story</span><span><i class="mv"></i>Move over 2%</span></span></div>
      <div id="chart"></div><div class="tip" id="tip"></div>
    </div>
  </section>

  <section class="grid">
    <aside class="side">
      <div class="card"><span class="lbl">Assumption radar, last 7 days</span><div id="radar"></div></div>
      <div class="card"><span class="lbl">Thesis tracker</span><div id="theses" style="margin-top:8px"></div></div>
    </aside>
    <main>
      <div class="tools">
        <div class="seg" id="seg"></div>
        <input class="search" id="q" placeholder="Search headlines and sources   /">
      </div>
      <div id="active"></div>
      <div id="feed"></div>
      <footer>
        <span><kbd>j</kbd> <kbd>k</kbd> move</span><span><kbd>o</kbd> open</span><span><kbd>b</kbd> add to brief</span><span><kbd>/</kbd> search</span>
        <span id="foot"></span>
      </footer>
      <div class="srcs" id="srcs"></div>
    </main>
  </section>
</div>

<div class="brief"><button class="fab" id="fab">Weekly brief</button></div>
<div class="sheet" id="sheet"><div>
  <h3>Weekly brief</h3>
  <p>Material stories for the period, strongest first. Stories you marked with + are always included.</p>
  <div class="row"><input type="date" id="from"><span>to</span><input type="date" id="to">
    <button class="btn" id="copy">Copy</button><button class="btn ghost" id="close">Close</button></div>
  <textarea id="brieftext" spellcheck="false"></textarea>
</div></div>

<script>
const $=id=>document.getElementById(id), el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={news:null,status:null,ticker:store.get("ticker",null),view:"material",driver:null,day:null,q:"",sel:-1,
  picked:new Set(store.get("picked",[])),lastVisit:store.get("lastVisit",0),visible:[]};
const fmtPct=v=>v==null?"n/a":(v>0?"+":"")+v.toFixed(2)+"%", cls=v=>v==null?"":v>=0?"up":"down";
const ET=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"});
const dayOf=iso=>ET.format(new Date(iso));
const nice=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return"just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}

async function load(){
  try{
    const t="?t="+Math.floor(Date.now()/60000);
    const [n,s]=await Promise.all([fetch("data/news.json"+t).then(r=>r.json()),fetch("data/status.json"+t).then(r=>r.json())]);
    S.news=n;S.status=s;
    if(!S.ticker||!n.meta.companies.some(c=>c.ticker===S.ticker))S.ticker=n.meta.companies[0].ticker;
    render();
  }catch(e){
    $("updated").textContent="Waiting for the first data run";
    $("feed").replaceChildren(el("div","empty","No data yet. The collector runs on GitHub every 30 minutes, the first results appear a few minutes after setup."));
  }
}
const items=()=>S.news.items.filter(i=>i.ticker===S.ticker);
const company=()=>S.news.meta.companies.find(c=>c.ticker===S.ticker);
const drv=id=>S.news.meta.drivers.find(d=>d.id===id)||{label:id,assumption:"",weight:1};
const isMat=i=>i.materiality!=="low";

function render(){
  $("title").textContent=S.news.meta.title;document.title=S.ticker+" · "+S.news.meta.title;
  const tabs=$("tabs");tabs.replaceChildren();
  S.news.meta.companies.forEach(c=>{const b=el("button","tab"+(c.ticker===S.ticker?" on":""),c.ticker);b.onclick=()=>{S.ticker=c.ticker;store.set("ticker",c.ticker);S.driver=S.day=null;render()};tabs.append(b)});
  const mins=(Date.now()-new Date(S.status.updatedAt))/60000;
  $("dot").className="dot "+(mins<75?"ok":"stale");
  $("updated").textContent="Updated "+ago(S.status.updatedAt);
  renderPrice();renderChart();renderRadar();renderTheses();renderFeed();renderSources();
}

function renderPrice(){
  const p=(S.status.prices||{})[S.ticker], c=company(), box=$("pricecard");box.replaceChildren();
  box.append(el("span","lbl",c.name+" · "+c.ticker));
  if(!p||!p.price){box.append(el("div","empty","Price not loaded yet"));return}
  const px=el("div","px num","$"+p.price.toFixed(2));px.append(el("small","",nice(p.date)+" close"));box.append(px);
  const g=el("div","chg");[["1D",p.d1],["5D",p.d5],["1M",p.m1],["YTD",p.ytd]].forEach(([k,v])=>{const d=el("div");d.append(el("b","num "+cls(v),fmtPct(v)),el("span","",k));g.append(d)});box.append(g);
  const m=c.model;if(m&&m.target){
    const upv=(m.target/p.price-1)*100, t=el("div","tgt");
    const l=el("div");l.append(el("span","lbl",m.target_label||"Target"),el("div","num","$"+m.target.toFixed(2)));
    const r=el("div");r.style.textAlign="right";r.append(el("span","lbl","Upside at live price"),el("b","num "+cls(upv),fmtPct(upv)));
    t.append(l,r);box.append(t);
    const lo=Math.min(p.price,m.target)*0.94, hi=Math.max(p.price,m.target)*1.06, pos=v=>((v-lo)/(hi-lo)*100)+"%";
    const bar=el("div","bar"),u=el("u"),i1=el("i"),i2=el("i");u.style.left=pos(Math.min(p.price,m.target));u.style.width=(Math.abs(m.target-p.price)/(hi-lo)*100)+"%";
    i1.style.left=pos(p.price);i2.style.left=pos(m.target);i2.style.background="var(--accent)";bar.append(u,i1,i2);box.append(bar);
  }
}

function renderChart(){
  const p=(S.status.prices||{})[S.ticker], host=$("chart");host.replaceChildren();
  if(!p||!p.series||p.series.length<3){host.append(el("div","empty","Chart appears after the first price update"));return}
  const ser=p.series, W=host.clientWidth||700, H=200, padL=6, padR=46, padT=14, padB=22;
  const cs=ser.map(s=>s.c), lo=Math.min(...cs), hi=Math.max(...cs), span=(hi-lo)||1;
  const x=i=>padL+i*(W-padL-padR)/(ser.length-1), y=v=>padT+(1-(v-lo)/span)*(H-padT-padB);
  const NS="http://www.w3.org/2000/svg", mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  const svg=mk("svg",{viewBox:`0 0 ${W} ${H}`,height:H});
  const byDay={};items().filter(i=>i.materiality==="high").forEach(i=>{let d=dayOf(i.publishedAt);const idx=ser.findIndex(s=>s.d>=d);if(idx<0)return;(byDay[ser[idx].d]=byDay[ser[idx].d]||[]).push(i)});
  [lo,(lo+hi)/2,hi].forEach(v=>{svg.append(mk("line",{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:"var(--line)","stroke-dasharray":"2 4"}));const t=mk("text",{x:W-padR+6,y:y(v)+4,fill:"var(--muted)","font-size":10,"font-family":"ui-monospace,Menlo,monospace"});t.textContent=v.toFixed(0);svg.append(t)});
  const step=(W-padL-padR)/(ser.length-1);
  ser.forEach((s,i)=>{if(i&&Math.abs(s.c/ser[i-1].c-1)>=0.02)svg.append(mk("rect",{x:x(i)-step/2,y:padT,width:step,height:H-padT-padB,fill:s.c>ser[i-1].c?"var(--up)":"var(--down)",opacity:.13}))});
  const d=ser.map((s,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(s.c).toFixed(1)).join(" ");
  const up=cs[cs.length-1]>=cs[0], col=up?"var(--up)":"var(--down)";
  const gid="g"+S.ticker, defs=mk("defs",{}), lg=mk("linearGradient",{id:gid,x1:0,x2:0,y1:0,y2:1});
  lg.append(mk("stop",{offset:"0","stop-color":col,"stop-opacity":.22}),mk("stop",{offset:"1","stop-color":col,"stop-opacity":0}));defs.append(lg);svg.append(defs);
  svg.append(mk("path",{d:d+` L${x(ser.length-1)} ${H-padB} L${x(0)} ${H-padB} Z`,fill:`url(#${gid})`}));
  svg.append(mk("path",{d,fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
  [0,Math.floor((ser.length-1)/2),ser.length-1].forEach(i=>{const t=mk("text",{x:x(i),y:H-5,fill:"var(--muted)","font-size":10,"text-anchor":i===0?"start":i===ser.length-1?"end":"middle"});t.textContent=nice(ser[i].d).replace(/^\w+, /,"");svg.append(t)});
  ser.forEach((s,i)=>{if(byDay[s.d]){svg.append(mk("circle",{cx:x(i),cy:y(s.c),r:8,fill:"var(--accent)",opacity:.22}));svg.append(mk("circle",{cx:x(i),cy:y(s.c),r:4,fill:"var(--accent)",stroke:"var(--panel)","stroke-width":1.5}))}});
  const cur=mk("line",{y1:padT,y2:H-padB,stroke:"var(--muted)","stroke-width":1,visibility:"hidden"});svg.append(cur);
  const hit=mk("rect",{x:0,y:0,width:W,height:H,fill:"transparent",style:"cursor:pointer"});svg.append(hit);host.append(svg);
  const tip=$("tip"), idxAt=ev=>{const r=svg.getBoundingClientRect();return Math.max(0,Math.min(ser.length-1,Math.round(((ev.clientX-r.left)/r.width*W-padL)/step)))};
  hit.onmousemove=ev=>{const i=idxAt(ev),s=ser[i],ch=i?(s.c/ser[i-1].c-1)*100:null;cur.setAttribute("x1",x(i));cur.setAttribute("x2",x(i));cur.setAttribute("visibility","visible");
    tip.replaceChildren();const h=el("h5");h.append(el("span","",nice(s.d)),el("span","num "+cls(ch),"$"+s.c.toFixed(2)+(ch==null?"":"  "+fmtPct(ch))));tip.append(h);
    const st=(byDay[s.d]||[]).sort((a,b)=>b.score-a.score).slice(0,3);
    if(st.length)st.forEach(n=>{const q=el("p");q.append(el("b","",n.title));tip.append(q)});else tip.append(el("p","","No high materiality stories that day. Click to see all stories."));
    tip.style.display="block";const r=host.parentElement.getBoundingClientRect(),sx=svg.getBoundingClientRect();
    let left=sx.left-r.left+x(i)/W*sx.width+14;if(left+280>r.width)left-=300;tip.style.left=Math.max(6,left)+"px";tip.style.top="44px"};
  hit.onmouseleave=()=>{tip.style.display="none";cur.setAttribute("visibility","hidden")};
  hit.onclick=ev=>{const d=ser[idxAt(ev)].d;S.day=S.day===d?null:d;S.view="all";renderFeed();$("active").scrollIntoView({behavior:"smooth",block:"nearest"})};
}

function weekItems(){const cut=Date.now()-7*864e5;return items().filter(i=>new Date(i.publishedAt)>=cut&&isMat(i))}
function renderRadar(){
  const box=$("radar");box.replaceChildren();const wk=weekItems();
  const rows=S.news.meta.drivers.map(d=>{const its=wk.filter(i=>i.drivers.includes(d.id));return{d,n:its.length,heat:its.reduce((a,i)=>a+i.score,0)}}).sort((a,b)=>b.heat-a.heat);
  const max=Math.max(1,...rows.map(r=>r.heat));
  rows.forEach(r=>{const b=el("button","drv"+(S.driver===r.d.id?" on":""));b.append(el("b","",r.d.label),el("span","n num",String(r.n)),el("em","","Model: "+r.d.assumption));
    const h=el("div","heat"),i=el("i");i.style.width=(r.heat/max*100)+"%";h.append(i);b.append(h);
    b.onclick=()=>{S.driver=S.driver===r.d.id?null:r.d.id;renderRadar();renderFeed()};box.append(b)});
}
function renderTheses(){
  const box=$("theses");box.replaceChildren();const m=company().model;if(!m||!m.theses){box.append(el("span","lbl","Not set for this company"));return}
  const wk=weekItems();
  m.theses.forEach((t,ix)=>{const its=wk.filter(i=>i.drivers.some(d=>t.drivers.includes(d))),hi=its.filter(i=>i.materiality==="high").length;
    const d=el("div","th");d.append(el("span","pill"+(hi?" high":its.length?" medium":""),hi?hi+" to review":its.length?"watch":"quiet"),el("b","",(ix+1)+". "+t.name),
      el("span","",its.length?its.length+" material stories this week touch it":"No material stories this week"));box.append(d)});
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  return items().filter(i=>(S.view==="all"||(S.view==="high"?i.materiality==="high":isMat(i)))
    &&(!S.driver||i.drivers.includes(S.driver))&&(!S.day||dayOf(i.publishedAt)===S.day)
    &&(!q||(i.title+" "+(i.sources||[]).join(" ")).toLowerCase().includes(q)));
}
function renderFeed(){
  const all=items(), seg=$("seg");seg.replaceChildren();
  [["high","High",all.filter(i=>i.materiality==="high").length],["material","Material",all.filter(isMat).length],["all","All",all.length]].forEach(([k,l,n])=>{
    const b=el("button",S.view===k?"on":"",l);b.append(el("span","num",String(n)));b.onclick=()=>{S.view=k;S.sel=-1;renderFeed()};seg.append(b)});
  const act=$("active");act.replaceChildren();
  const tag=(txt,fn)=>{const c=el("button","chip",txt+"  ×");c.style.marginRight="6px";c.onclick=fn;act.append(c)};
  if(S.driver)tag(drv(S.driver).label,()=>{S.driver=null;renderRadar();renderFeed()});
  if(S.day)tag(nice(S.day),()=>{S.day=null;renderFeed()});
  const list=filtered(), feed=$("feed");feed.replaceChildren();S.visible=list;
  if(!list.length){feed.append(el("div","empty",all.length?"Nothing matches these filters.":"No stories collected yet."));return}
  let cur="";
  list.forEach((n,ix)=>{
    const d=dayOf(n.publishedAt);if(d!==cur){cur=d;feed.append(el("div","day",nice(d)))}
    const s=el("article","story "+n.materiality+(ix===S.sel?" sel":""));s.dataset.ix=ix;
    const bd=el("div","badge");bd.append(el("span","pill "+n.materiality,n.materiality==="high"?"High":n.materiality==="medium"?"Medium":"Low"));s.append(bd);
    const a=el("a","t",n.title);a.href=n.url;a.target="_blank";a.rel="noopener";s.append(a);
    const m=el("div","m");m.append(el("span","",n.source||"Unknown source"));
    if(n.tier==="top")m.append(el("span","pill tier","Top source"));
    if(n.sourceCount>1){const c=el("span","chip","+"+(n.sourceCount-1)+" more");c.title=(n.sources||[]).join(", ");m.append(c)}
    m.append(el("span","num",ago(n.publishedAt)));
    if(new Date(n.firstSeen||n.publishedAt)>S.lastVisit&&S.lastVisit)m.append(el("span","pill new","New"));
    s.append(m);
    if(n.drivers.length){const w=el("div","why");w.append("Touches ");n.drivers.slice(0,3).forEach((id,k)=>{if(k)w.append(", ");w.append(el("b","",drv(id).assumption))});s.append(w)}
    const add=el("button","add"+(S.picked.has(n.id)?" on":""),S.picked.has(n.id)?"✓":"+");add.title="Add to weekly brief";
    add.onclick=()=>{S.picked.has(n.id)?S.picked.delete(n.id):S.picked.add(n.id);store.set("picked",[...S.picked]);renderFeed();fabLabel()};s.append(add);
    feed.append(s)});
  $("foot").textContent=all.length+" stories kept, "+all.filter(i=>new Date(i.firstSeen||0)>S.lastVisit).length+" new since your last visit";
  fabLabel();
}
function renderSources(){const b=$("srcs");b.replaceChildren();(S.status.sources||[]).filter(s=>s.ticker===S.ticker).forEach(s=>{const e=el("span",s.ok?"":"bad",s.name.replace(/^https?:\/\//,"").slice(0,42)+(s.ok?" · "+s.count:" · failed"));if(!s.ok)e.title=s.error;b.append(e)})}

/* weekly brief */
function lastWed(){const d=new Date();const back=(d.getDay()+4)%7;d.setDate(d.getDate()-back);return d}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function fabLabel(){$("fab").textContent="Weekly brief"+(S.picked.size?" · "+S.picked.size:"")}
function buildBrief(){
  const f=$("from").value,t=$("to").value;
  const inR=items().filter(i=>{const d=dayOf(i.publishedAt);return d>=f&&d<=t});
  const pick=inR.filter(i=>S.picked.has(i.id)), auto=inR.filter(i=>i.materiality==="high"&&!S.picked.has(i.id));
  const rows=[...pick,...auto].sort((a,b)=>b.score-a.score).slice(0,12);
  const line=i=>"• "+i.title+" ("+(i.source||"source")+", "+nice(dayOf(i.publishedAt)).replace(/^\w+, /,"")+")\n  Touches: "+(i.drivers.map(d=>drv(d).assumption).slice(0,2).join("; ")||"n/a")+"\n  "+i.url;
  const p=(S.status.prices||{})[S.ticker];
  $("brieftext").value=S.ticker+" material news, "+nice(f)+" to "+nice(t)+"\n"+(p&&p.price?"Price $"+p.price.toFixed(2)+" ("+p.date+"), 5D "+fmtPct(p.d5)+"\n":"")+"\n"+(rows.length?rows.map(line).join("\n\n"):"No high materiality stories in this period. Mark stories with + to include them.");
}
$("fab").onclick=()=>{const w=lastWed(),p=new Date(w);p.setDate(p.getDate()-7);if(!$("from").value){$("from").value=ymd(ymd(w)===ymd(new Date())?p:w);$("to").value=ymd(new Date())}buildBrief();$("sheet").classList.add("on")};
$("from").onchange=$("to").onchange=buildBrief;
$("close").onclick=()=>$("sheet").classList.remove("on");
$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("on")};
$("copy").onclick=async()=>{const ta=$("brieftext");try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand("copy")}$("copy").textContent="Copied";setTimeout(()=>$("copy").textContent="Copy",1400)};

/* controls */
$("q").oninput=e=>{S.q=e.target.value;S.sel=-1;renderFeed()};
$("theme").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark"),n=cur==="dark"?"light":"dark";r.dataset.theme=n;store.set("theme",n);if(S.news)renderChart()};
(()=>{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t})();
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){if(e.key==="Escape")e.target.blur();return}
  if(e.metaKey||e.ctrlKey||e.altKey||!S.news)return;
  if(e.key==="/"){e.preventDefault();$("q").focus();return}
  if(e.key==="Escape"){$("sheet").classList.remove("on");return}
  const n=S.visible.length;if(!n)return;
  if(e.key==="j"||e.key==="k"){S.sel=Math.max(0,Math.min(n-1,S.sel+(e.key==="j"?1:-1)));renderFeed();const s=document.querySelector(".story.sel");if(s)s.scrollIntoView({block:"nearest",behavior:"smooth"})}
  else if(e.key==="o"&&S.sel>=0)window.open(S.visible[S.sel].url,"_blank","noopener");
  else if(e.key==="b"&&S.sel>=0){const id=S.visible[S.sel].id;S.picked.has(id)?S.picked.delete(id):S.picked.add(id);store.set("picked",[...S.picked]);renderFeed()}
});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>S.news&&renderChart(),150)});
load().then(()=>setTimeout(()=>store.set("lastVisit",Date.now()),4000));
setInterval(load,5*60*1000);
</script>
