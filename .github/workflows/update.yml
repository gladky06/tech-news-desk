name: Update news

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python tests/test_fetch.py
      - name: Fetch news and prices
        run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update news data"
          git pull --rebase --autostash origin main
          git push
